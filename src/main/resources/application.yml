server:
  port: 80
  servlet:
    session:
      timeout: 30m
  # 修复生产环境端口显示问题
  forward-headers-strategy: native
  use-forward-headers: true

spring:
  application:
    name: aegis-demo
  profiles:
    active: ${MODE:dev}
  
  # Thymeleaf 配置
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
    servlet:
      content-type: text/html


# 日志配置 - 用于调试和学习
logging:
  level:
    # Spring Security 基础日志
    org.springframework.security: INFO
    # 我们自定义的代码，设置为 DEBUG 以便观察 OAuth2 流程
    com.aegis.demo: DEBUG
    # HTTP 客户端日志（用于观察与 Keycloak 的通信）
    org.springframework.web.reactive.function.client: DEBUG
    # 根日志级别
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

