<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Demo - Keycloak SSO 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center p-5">
                        <div class="mb-4">
                            <h1 class="card-title text-primary mb-2">
                                <i class="fas fa-shield-alt"></i> Aegis Demo
                            </h1>
                            <p class="text-muted">手动实现 OAuth2/OIDC 协议的 Keycloak 集成演示</p>
                            <div class="alert alert-info py-2" role="alert">
                                <small>
                                    <i class="fas fa-graduation-cap me-1"></i>
                                    <strong>教学项目：</strong>展示 OAuth2 授权码流程的底层实现原理
                                </small>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <i class="fas fa-key fa-3x text-primary mb-3"></i>
                            <h3 class="mb-3">欢迎使用 SSO 登录</h3>
                            <p class="text-muted">点击下方按钮使用 Keycloak 进行安全登录</p>
                        </div>

                        <div class="d-grid">
                            <a th:href="@{/login}" 
                               class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt me-2"></i>
                                开始 OAuth2 登录流程
                            </a>
                        </div>

                        <div class="mt-4 pt-3 border-top">
                            <small class="text-muted">
                                <i class="fas fa-info-circle me-1"></i>
                                手动实现的 OAuth2 授权码流程 + PKCE 安全增强
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
