<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登出确认 - Aegis Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-shield-alt me-2"></i>Aegis Demo
            </a>
            <div class="navbar-nav ms-auto">
                <a href="/" class="btn btn-outline-light">
                    <i class="fas fa-home me-1"></i>首页
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-warning text-dark text-center">
                        <h3 class="card-title mb-0">
                            <i class="fas fa-sign-out-alt me-2"></i>登出确认
                        </h3>
                    </div>
                    <div class="card-body text-center p-4">
                        <!-- 登录状态检查 -->
                        <div th:if="${isLoggedIn}">
                            <div class="mb-4">
                                <i class="fas fa-user-circle fa-4x text-warning mb-3"></i>
                                <h4 class="mb-3">确认登出</h4>
                                <p class="text-muted mb-2">用户：<span class="fw-bold" th:text="${username}">-</span></p>
                                <p class="text-muted">您确定要退出登录吗？</p>
                            </div>
                            
                            <div class="alert alert-info mb-4" role="alert">
                                <i class="fas fa-info-circle me-2"></i>
                                <small>
                                    <strong>注意：</strong>这将会从所有相关应用程序中登出（单点登出）
                                </small>
                            </div>

                            <div class="d-grid gap-2">
                                <!-- 确认登出按钮 -->
                                <form th:action="@{/logout}" method="post" class="mb-2">
                                    <button type="submit" class="btn btn-danger btn-lg w-100">
                                        <i class="fas fa-sign-out-alt me-2"></i>
                                        确认登出
                                    </button>
                                </form>
                                
                                <!-- 取消按钮 -->
                                <a href="/user" class="btn btn-outline-secondary">
                                    <i class="fas fa-times me-2"></i>取消
                                </a>
                            </div>
                        </div>

                        <!-- 未登录状态 -->
                        <div th:unless="${isLoggedIn}">
                            <div class="mb-4">
                                <i class="fas fa-info-circle fa-4x text-info mb-3"></i>
                                <h4 class="mb-3">您尚未登录</h4>
                                <p class="text-muted">看起来您还没有登录系统</p>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <a href="/login" class="btn btn-primary btn-lg">
                                    <i class="fas fa-sign-in-alt me-2"></i>
                                    前往登录
                                </a>
                                
                                <a href="/" class="btn btn-outline-secondary">
                                    <i class="fas fa-home me-2"></i>返回首页
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- OAuth2 说明信息 -->
                <div class="card shadow mt-4">
                    <div class="card-body">
                        <h6 class="text-primary mb-3">
                            <i class="fas fa-graduation-cap me-2"></i>OAuth2 单点登出流程
                        </h6>
                        <small class="text-muted">
                            <ul class="mb-0">
                                <li>清除应用本地会话</li>
                                <li>重定向到 Keycloak 登出端点</li>
                                <li>Keycloak 处理全局登出</li>
                                <li>从所有相关应用程序中登出</li>
                                <li>重定向回应用首页</li>
                            </ul>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
